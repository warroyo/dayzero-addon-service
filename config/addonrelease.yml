#@ load("@ytt:data", "data")
#@ load("helpers.star", "acd_name")
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonRelease
metadata:
  name: #@ "{}.{}".format(data.values.addon_name, data.values.addon_version)
  namespace: #@ data.values.addon_namespace
  labels:
    addon.kubernetes.vmware.com/addon-name: #@ data.values.addon_name
spec:
  addonRef:
    name: #@ data.values.addon_name
    namespace: #@ data.values.addon_namespace
  addonConfigDefinitionRef:
    name: #@ acd_name()
    namespace: #@ data.values.addon_namespace
  version: #@ data.values.addon_version
  kubernetesVersionConstraints: #@ data.values.kubernetes_version_constraints
  #! No spec.package: this addon is pure configuration. No dependsOn either, so the
  #! payload lands as early as the addon system allows. See docs/design.md.
