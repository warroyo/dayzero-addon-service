#@ load("@ytt:data", "data")

#! Identity the inner App applies the addon CRs with. Namespaced resources in this
#! package are rewritten into the service's own namespace, so that is where these land.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootstrap-addon-installer
  namespace: #@ data.values.namespace

#! kapp keeps its app state in ConfigMaps alongside the App.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-addon-installer
  namespace: #@ data.values.namespace
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootstrap-addon-installer
  namespace: #@ data.values.namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bootstrap-addon-installer
subjects:
- kind: ServiceAccount
  name: bootstrap-addon-installer
  namespace: #@ data.values.namespace

#! Cluster-scoped, and therefore exempt from the namespace rewrite: this is what lets
#! the App reach vmware-system-vks-public at all. Creating it is subject to Kubernetes
#! escalation-prevention, so the deployer account must already hold these verbs.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vks-bootstrap-addon-installer
rules:
- apiGroups: ["addons.kubernetes.vmware.com"]
  resources: ["addons", "addonreleases", "addonconfigdefinitions"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vks-bootstrap-addon-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vks-bootstrap-addon-installer
subjects:
- kind: ServiceAccount
  name: bootstrap-addon-installer
  namespace: #@ data.values.namespace
