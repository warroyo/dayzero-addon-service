#@ load("@ytt:data", "data")
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: Addon
metadata:
  name: #@ data.values.addon_name
  namespace: #@ data.values.addon_namespace
spec:
  displayName: Cluster Bootstrap YAML
  description: >-
    Applies operator-supplied Kubernetes YAML into a VKS cluster at provisioning time,
    before external GitOps tooling is aware the cluster exists. Carries no Carvel
    package and no container images.
