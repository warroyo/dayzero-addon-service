#@ load("@ytt:data", "data")
#@ load("helpers.star", "addon_namespace")
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: Addon
metadata:
  name: #@ data.values.addon_name
  namespace: #@ addon_namespace()
spec:
  displayName: Cluster Bootstrap YAML
  description: >-
    Applies operator-supplied Kubernetes YAML into a VKS cluster at provisioning time:
    namespaces, service accounts, RBAC, quotas and other day-zero configuration, with
    no workload cluster kubeconfig. Carries no Carvel package and no container images.
