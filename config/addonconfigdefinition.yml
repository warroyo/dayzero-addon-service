#@ load("@ytt:data", "data")
#@ load("helpers.star", "acd_name")

#! Everything inside a `template:` block is Go template + sprig, evaluated per cluster
#! by the addon controller, and is the resource BODY only - apiVersion, kind and
#! metadata come from targetClusterOutput. Context roots and the function map are
#! documented in docs/design.md; test/render_test.go reproduces them.
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfigDefinition
metadata:
  name: #@ acd_name()
  namespace: #@ data.values.addon_namespace
  labels:
    addon.kubernetes.vmware.com/addon-name: #@ data.values.addon_name
spec:
  #! Reads the optional payload ConfigMap from the cluster's Supervisor namespace.
  #! Supervisor-side rights only, not guest-cluster rights.
  addonInstallPermission:
    accessPolicies:
    - order: 0
      rules:
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list", "watch"]

  schema:
    openAPIV3Schema:
      type: object
      properties:
        resources:
          type: array
          description: >-
            Kubernetes resources to apply into the cluster, as structured YAML. Each
            item is one complete resource. Use this when the payload is authored
            alongside the AddonConfig.
          items:
            type: object
            x-kubernetes-preserve-unknown-fields: true
        resourcesYaml:
          type: string
          description: >-
            Kubernetes resources to apply into the cluster, as a single raw
            multi-document YAML string. Use this for pasting existing manifests
            verbatim.
        clusterRoleName:
          type: string
          default: cluster-admin
          description: >-
            ClusterRole the payload is applied with. cluster-admin matches what the
            tenant already holds over their own workload cluster. Narrow it if the
            Supervisor namespace contains users who should not have that.
        syncPeriod:
          type: string
          default: 10m
          description: How often kapp-controller re-reconciles the payload.
        noopDelete:
          type: boolean
          default: false
          description: >-
            When true, removing the addon leaves the payload resources in place
            instead of deleting them.

  templateInputResources:
  #! Optional: the App must still render when no ConfigMap exists.
  - inputName: bootstrapConfigMap
    apiVersion: v1
    kind: ConfigMap
    name: '{{.Cluster.name}}-bootstrap'
    scope: Namespace
    constraints:
    - operator: optional

  templateOutputResources:
  #! 1 - namespace holding the App and its identity.
  - targetClusterOutput:
      apiVersion: v1
      kind: Namespace
      name: vks-bootstrap
      scope: Cluster
    template: |
      spec: {}

  #! 2 - identity kapp-controller applies the payload with.
  - targetClusterOutput:
      apiVersion: v1
      kind: ServiceAccount
      name: vks-bootstrap
      namespace: vks-bootstrap
      scope: Namespace
    template: |
      automountServiceAccountToken: true

  #! 3 - grants that identity its permissions.
  - targetClusterOutput:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      name: vks-bootstrap
      scope: Cluster
    template: |
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: {{ .Values.clusterRoleName }}
      subjects:
      - kind: ServiceAccount
        name: vks-bootstrap
        namespace: vks-bootstrap

  #! 4 - the App that applies the payload. Payload values are JSON-encoded, which is
  #! valid YAML and needs no indentation arithmetic.
  - targetClusterOutput:
      apiVersion: kappctrl.k14s.io/v1alpha1
      kind: App
      name: vks-bootstrap
      namespace: vks-bootstrap
      scope: Namespace
    template: |
      spec:
        serviceAccountName: vks-bootstrap
        syncPeriod: {{ .Values.syncPeriod }}
        noopDelete: {{ .Values.noopDelete }}
        fetch:
        - inline:
            paths:
              00-placeholder.yml: "#! no payload supplied\n"
              {{- if .Values.resourcesYaml }}
              10-inline.yml: {{ .Values.resourcesYaml | toJson }}
              {{- end }}
              {{- range $i, $r := .Values.resources }}
              {{ printf "20-structured-%03d.yml" $i }}: {{ $r | toYaml | toJson }}
              {{- end }}
              {{- if .Dependencies }}
              {{- if .Dependencies.bootstrapConfigMap }}
              {{- range $k, $v := .Dependencies.bootstrapConfigMap.data }}
              {{ $k | toJson }}: {{ $v | toJson }}
              {{- end }}
              {{- end }}
              {{- end }}
        template:
        # Required field; a passthrough that tolerates "#" comments in the payload.
        - ytt:
            ignoreUnknownComments: true
        deploy:
        - kapp: {}
