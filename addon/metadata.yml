#@ load("@ytt:data", "data")
---
apiVersion: data.packaging.carvel.dev/v1alpha1
kind: PackageMetadata
metadata:
  name: #@ "{}.kubernetes.vmware.com".format(data.values.addon_name)
spec:
  displayName: Cluster Day-Zero Config
  shortDescription: Seed VKS clusters with arbitrary YAML at provisioning time
  longDescription: >-
    Applies operator-supplied Kubernetes YAML into a workload cluster as it is
    provisioned: namespaces, service accounts, RBAC, resource quotas and other day-zero
    configuration. Tenants attach it with an AddonInstall and supply the payload through
    an AddonConfig, with no workload cluster kubeconfig and no per-payload artifact.
  categories:
  - Configuration
  - Security
