#@data/values-schema
---

#! Addon name. Tenants reference this from AddonInstall.spec.addonRef and it forms the
#! required "<cluster-name>-<addon-name>" AddonConfig name.
addon_name: "dayzero"

#! Addon / package version.
addon_version: "1.0.0"

#! Guest cluster Kubernetes versions this addon supports. Plain semver range, matching
#! the format used by the shipped VKS addons (e.g. ">=1.35.0 <1.36.0").
kubernetes_version_constraints: ">=1.33.0"

#! The gzip+base64 AddonConfigDefinition, injected by `make bundle`. Do not set by hand.
acd_encoded: ""

#! The namespace guest PackageInstalls live in, where the values Secret is delivered.
guest_package_namespace: "vmware-system-tkg"

#! The package render files, injected from addon/render/ by `make bundle`.
render_values_schema: ""
render: ""
