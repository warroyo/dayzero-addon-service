#@ load("@ytt:data", "data")
#@ acd_name = "{}.kubernetes.vmware.com.{}".format(data.values.addon_name, data.values.addon_version)
#@ values_secret = "{{.Cluster.name}}-" + data.values.addon_name + "-data-values"
#! This file is rendered by ytt (for name/version) and then gzip+base64-encoded into the
#! Package annotation by `make bundle`. The manager decodes it and creates the ACD.
#!
#! Everything inside a `template:` block is Go template + sprig, evaluated per cluster by
#! the addon controller, and is the resource BODY only. See docs/design.md.
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfigDefinition
metadata:
  name: #@ acd_name
  namespace: vmware-system-vks-public
  labels:
    addon.kubernetes.vmware.com/addon-name: #@ data.values.addon_name
    addon.kubernetes.vmware.com/addon-namespace: vmware-system-vks-public
spec:
  #! Read the optional payload ConfigMap. Supervisor-side rights only, not guest-cluster
  #! rights. The clusterCR input needs no rule here, and neither does the output Secret,
  #! which is written into the guest -- see docs/design.md.
  addonInstallPermission:
    accessPolicies:
    - order: 0
      rules:
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list", "watch"]

  schema:
    openAPIV3Schema:
      type: object
      properties:
        resources:
          type: array
          description: >-
            Kubernetes resources to apply into the cluster, as structured YAML. Each
            item is one complete resource.
          default: []
          items:
            type: object
            x-kubernetes-preserve-unknown-fields: true
        resourcesYaml:
          type: string
          description: >-
            Kubernetes resources to apply into the cluster, as a single raw
            multi-document YAML string.
          default: ""

  templateInputResources:
  #! Optional: the payload must still render when no ConfigMap exists.
  - inputName: dayzeroConfigMap
    apiVersion: v1
    kind: ConfigMap
    name: '{{.Cluster.name}}-dayzero'
    scope: Namespace
    constraints:
    - operator: optional

  #! Required: supplies the ${CLUSTER_UID} token, which .Cluster cannot. See docs/design.md.
  - inputName: clusterCR
    apiVersion: cluster.x-k8s.io/v1beta2
    kind: Cluster
    name: '{{.Cluster.name}}'
    scope: Namespace

  #! One output: the values Secret in the guest package namespace, which the guest
  #! PackageInstall consumes. The package's ytt reads these and emits the resources.
  #!
  #! Token expansion must stay after the ConfigMap concatenation; docs/design.md explains
  #! why, and why the unresolved-UID guard is an exact-string test and nothing cleverer.
  templateOutputResources:
  - targetClusterOutput:
      apiVersion: v1
      kind: Secret
      name: #@ values_secret
      namespace: #@ data.values.guest_package_namespace
    template: |
      {{- $rawYaml := .Values.resourcesYaml | default "" -}}
      {{- if and .Dependencies (hasKey .Dependencies "dayzeroConfigMap") }}{{- range $k, $v := .Dependencies.dayzeroConfigMap.data }}
      {{- $rawYaml = printf "%s\n---\n%s" $rawYaml $v }}
      {{- end }}{{- end }}
      {{- $uid := "" -}}
      {{- if and .Dependencies (hasKey .Dependencies "clusterCR") }}{{- $uid = printf "%v" .Dependencies.clusterCR.metadata.uid -}}{{- end }}
      {{- $json := .Values.resources | default list | toJson -}}
      {{- if and (eq $uid "") (or (contains "${CLUSTER_UID}" $rawYaml) (contains "${CLUSTER_UID}" $json)) }}
      {{- fail "dayzero: payload uses ${CLUSTER_UID} but the cluster UID did not resolve" }}
      {{- end }}
      {{- $rawYaml = $rawYaml | replace "${CLUSTER_NAME}" .Cluster.name | replace "${CLUSTER_UID}" $uid -}}
      stringData:
        values.yaml: |
          resourcesJson: {{ $json | replace "${CLUSTER_NAME}" .Cluster.name | replace "${CLUSTER_UID}" $uid | toJson }}
          resourcesYaml: {{ $rawYaml | toJson }}
      type: Opaque
