#@ load("@ytt:data", "data")
#@ load("@ytt:json", "json")

#! The versions are deliberately absent: the manager materialises whatever the bundle
#! serves and never checks it against this annotation (verified), while the webhook
#! forbids updating the annotation on an in-use AddonRepository. A version list here
#! could never be brought up to date as the catalog grows.
#@ offerings = {"repositoryVersion": "1.0.0", "packages": {data.values.addon_package: {"versions": []}}}

#! An AddonRepository is frozen once an AddonRepositoryInstall references it, and update
#! is rejected while delete and create are allowed. So nothing here may vary per release:
#! the names carry no version, the imageURL is the floating tag, and an upgrade of this
#! service re-applies both resources unchanged, which kapp skips. New package versions
#! reach clusters through the tag, not through a service upgrade. targetRepositoryName
#! names the backing Carvel PackageRepository, so two catalogs must not share one.
#@ name = data.values.repository_name

#! No explicit namespace: the Supervisor Service deploy rewrites these into the service's
#! own namespace, and the manager reconciles AddonRepository/AddonRepositoryInstall there
#! (verified). The install's ref points back at that same namespace.
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonRepository
metadata:
  name: #@ name
  annotations:
    addons.kubernetes.vmware.com/package-offerings: #@ json.encode(offerings)
spec:
  fetch:
    imgpkgBundle:
      imageURL: #@ data.values.addon_repo_image
  targetRepositoryName: #@ name
  #! A label on the registration, not on the catalog behind it. Constant, like the rest.
  version: "1.0.0"
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonRepositoryInstall
metadata:
  name: #@ name + "-install"
spec:
  addonRepositoryRef:
    name: #@ name
    namespace: #@ data.values.namespace
