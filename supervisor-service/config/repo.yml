#@ load("@ytt:data", "data")
#@ load("@ytt:json", "json")

#@ offerings = {"repositoryVersion": data.values.repository_version, "packages": {data.values.addon_package: {"versions": [data.values.addon_package_version]}}}

#! No explicit namespace: the Supervisor Service deploy rewrites these into the service's
#! own namespace, and the manager reconciles AddonRepository/AddonRepositoryInstall there
#! (verified). The install's ref points back at that same namespace.
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonRepository
metadata:
  name: dayzero-addon-repo
  annotations:
    addons.kubernetes.vmware.com/package-offerings: #@ json.encode(offerings)
spec:
  fetch:
    imgpkgBundle:
      imageURL: #@ data.values.addon_repo_image
  targetRepositoryName: dayzero-addon-repo
  version: #@ data.values.repository_version
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonRepositoryInstall
metadata:
  name: dayzero-addon-repo-install
spec:
  addonRepositoryRef:
    name: dayzero-addon-repo
    namespace: #@ data.values.namespace
