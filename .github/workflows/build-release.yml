name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # kbld is load-bearing: `kctrl package repository release` shells out to it to
      # generate the bundle's .imgpkg/images.yml.
      - name: Install Carvel Tools
        run: |
          curl -L https://carvel.dev/install.sh | sudo bash
          ytt version && imgpkg version && kbld version && kctrl version

      # A `v*` tag names a catalog publish, not a package version, and only sets the
      # immutable snapshot tag. What reaches registered repositories is the floating
      # `stable` tag, which `make push` re-points at the same bundle. The package versions
      # the catalog carries come from PKG_VERSIONS in the Makefile.
      - name: Set Version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "REPO_VERSION=${TAG#v}" >> $GITHUB_ENV
          else
            echo "REPO_VERSION=latest" >> $GITHUB_ENV
          fi
          echo "PKG_VERSIONS=$(make -s pkg-versions)" >> $GITHUB_ENV

      # Publishes the catalog bundle and builds the Supervisor Service package (kctrl
      # pushes the wrapper bundle to ghcr, hence the login above). `release` gates on
      # `check`, which fails the build if package-offerings and the bundle disagree.
      - name: Build and publish both packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: make release REPO_VERSION=${{ env.REPO_VERSION }}

      - name: Assemble install manifest for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp build/install/addonrepository.yml dayzero-addonrepository.yml

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dayzero-addonrepository.yml
            dayzero-addon.yml
          generate_release_notes: true
          body: |
            Catalog `${{ env.REPO_VERSION }}`, carrying `dayzero.kubernetes.vmware.com`
            at: ${{ env.PKG_VERSIONS }}. Published to
            `ghcr.io/warroyo/dayzero-addon-repo:${{ env.REPO_VERSION }}` as an immutable
            snapshot, and to `:stable`, which is the tag every registered repository
            follows.

            **Already installed? There is nothing to do.** Registered repositories
            re-resolve `:stable` on their own, roughly every 10 minutes, and materialise
            the package versions this catalog adds. The install artifacts below are
            unchanged from previous releases and do not need re-applying — an
            `AddonRepository` cannot be updated once in use, which is why nothing in them
            varies per release.

            First-time install, either way:

            - **Supervisor Service**: download `dayzero-addon.yml` and upload it through
              **Workload Management → Services → Add Service**.
            - **Direct apply**: `kubectl apply -f dayzero-addonrepository.yml`.

            Both register an `AddonRepository` named `dayzero-addon-repo-stable`, once and
            for good.
