name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Carvel Tools
        run: |
          curl -L https://carvel.dev/install.sh | sudo bash
          ytt version && imgpkg version

      - name: Set Version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          else
            echo "VERSION=latest" >> $GITHUB_ENV
          fi

      - name: Push the addon-repository bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: make push VERSION=${{ env.VERSION }}

      - name: Assemble install manifest for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp install/addonrepository.yml dayzero-addonrepository.yml

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dayzero-addonrepository.yml
          generate_release_notes: true
          body: |
            The addon-repository bundle for this release is published to
            `ghcr.io/warroyo/dayzero-addon-repo:${{ env.VERSION }}`.

            Install by applying `dayzero-addonrepository.yml` (point `imageURL` at the
            bundle above), or via the Supervisor Service in `supervisor-service/`.
