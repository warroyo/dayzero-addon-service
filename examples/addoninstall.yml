# Attaches the bootstrap addon to every cluster in this Supervisor namespace that
# carries the label addons.kubernetes.vmware.com/bootstrap: enabled.
#
# Apply this once per Supervisor namespace. Any cluster created afterwards with the
# label is seeded during provisioning, which is the point of the whole service.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: bootstrap-addoninstall
  namespace: my-namespace
  labels:
    app.kubernetes.io/name: bootstrap
spec:
  # Required. The addon lives in the Supervisor Service's own namespace, not in the
  # public addon catalog addonRef falls back to when this is unset. Find it with:
  # kubectl get addon -A | grep bootstrap
  addonRef:
    name: bootstrap
    namespace: svc-bootstrap-addon-svr31
  clusters:
  - selector:
      matchExpressions:
      - key: addons.kubernetes.vmware.com/bootstrap
        operator: In
        values:
        - enabled

  # Delete removes the payload when a cluster stops matching. Use Retain to leave the
  # seeded resources behind instead.
  stopMatchingBehavior: Delete
