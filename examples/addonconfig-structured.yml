# Payload as structured YAML rather than an embedded string. Each list item is one
# complete resource. Easier to diff and to generate, and it survives schema validation
# as real YAML instead of an opaque blob.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfig
metadata:
  name: my-cluster-bootstrap
  namespace: my-namespace
  labels:
    app.kubernetes.io/name: bootstrap
  annotations:
    clusteraddon.addons.kubernetes.vmware.com/owned-for-deletion: "true"
spec:
  clusterName: my-cluster
  values:
    resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: team-a

    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: deployer
        namespace: team-a

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: deployer
        namespace: team-a
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: edit
      subjects:
      - kind: ServiceAccount
        name: deployer
        namespace: team-a
