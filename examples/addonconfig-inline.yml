# Payload as a raw multi-document YAML string. Best for pasting manifests you already
# have. Everything under resourcesYaml is applied verbatim into the workload cluster.
#
# The name MUST be "<cluster-name>-<addon-name>" and the object MUST live in the
# cluster's own Supervisor namespace.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfig
metadata:
  name: my-cluster-dayzero
  namespace: my-namespace
  labels:
    app.kubernetes.io/name: dayzero
  annotations:
    # Without this the AddonConfig survives deletion of the ClusterAddon.
    clusteraddon.addons.kubernetes.vmware.com/owned-for-deletion: "true"
spec:
  clusterName: my-cluster
  values:
    resourcesYaml: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: team-a
      ---
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: deployer
        namespace: team-a
      ---
      # Human access granted to an SSO group rather than to individuals. Confirm the
      # exact subject string for your environment; a wrong one binds silently to nobody.
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: team-a-admins
        namespace: team-a
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: Group
        name: sso:team-a-admins@vsphere.local
