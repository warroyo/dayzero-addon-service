#! Data values for addonrepository.tpl.yml. `make install-manifest` supplies all of them
#! from the Makefile, so the defaults here only matter when rendering the template by hand.
#@data/values-schema
---

#! The catalog bundle the manager fetches. A floating tag on purpose: a release re-points
#! it at the newest bundle, the manager re-resolves it on its own, and the registered
#! AddonRepository never has to change. Point this at a snapshot tag instead (:1.1.0) to
#! pin a repository to one catalog publish forever.
addon_repo_image: "ghcr.io/warroyo/dayzero-addon-repo:stable"

#! Both object names. Carries no version: the pair is registered once and kept.
repository_name: "dayzero-addon-repo-stable"

#! The package this catalog serves. Named in the offerings annotation; the versions are
#! deliberately not listed there, see the template.
addon_package: "dayzero.kubernetes.vmware.com"

#! Where the two CRs go. The manager reconciles them from here.
namespace: "vmware-system-vks-public"
