apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: dayzero.kubernetes.vmware.com.1.0.3
  annotations:
    addon.kubernetes.vmware.com/addon-name: dayzero
    addons.kubernetes.vmware.com/addon-config-definition: 
spec:
  refName: dayzero.kubernetes.vmware.com
  version: 1.0.3
  kubernetesVersionSelection:
    constraints: '>=1.33.0'
  template:
    spec:
      fetch:
      - inline:
          paths:
            values-schema.yml: |
              #@data/values
              ---
              resourcesJson: "[]"
              resourcesYaml: ""
            render.yml: |
              #@ load("@ytt:data", "data")
              #@ load("@ytt:json", "json")
              #@ load("@ytt:yaml", "yaml")
              #@ for r in json.decode(data.values.resourcesJson):
              --- #@ r
              #@ end
              #@ for doc in data.values.resourcesYaml.split("\n---\n"):
              #@ if doc.strip() != "":
              --- #@ yaml.decode(doc)
              #@ end
              #@ end
      template:
      - ytt:
          paths:
          - values-schema.yml
          - render.yml
      deploy:
      - kapp: {}
